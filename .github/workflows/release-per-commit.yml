name: Release per main commit

on:
  push:
    branches: ["main"]

permissions:
  contents: write # Release 作成と asset upload に必要

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -eux
          APP_NAME="midiwav"
          OUT_DIR="dist"
          mkdir -p "${OUT_DIR}"
          SHA="${GITHUB_SHA::7}"
          OUT="${OUT_DIR}/${APP_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}_${SHA}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w" -o "${OUT}" .

      - name: Create/Update Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-${{ github.sha }}
          name: main-${{ github.sha }}
          prerelease: true
          files: dist/*
          fail_on_unmatched_files: true
